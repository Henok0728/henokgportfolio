<section id="contact" class="contact hidden">
    <div class="section-header">
        <h2></h2>
        <div class="header-line"></div>
    </div>
    <div class="contact-container">
        <form class="contact-form">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="input-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" required placeholder="Hello! I'd like to discuss a project..."></textarea>
            </div>
            <button type="submit" class="btn primary-btn submit-btn">Send Message</button>
        </form>
    </div>
</section>
